<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Tables Master Ledger - Founder Desk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f7f3ed;
      color: #3b2219;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100vw;
      overflow-x: hidden;
    }
    .top-navbar {
      background: #ffffff;
      border-bottom: 1px solid #dfcfbc;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn-top {
      background: #3b2219;
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .back-btn-top:hover { opacity: 0.9; }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #3b2219;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .breadcrumb {
      font-size: 13px;
      color: #785a46;
    }
    .breadcrumb span {
      color: #3b2219;
      font-weight: 700;
    }
    .selector-strip {
      background: #ffffff;
      border-bottom: 1px solid #dfcfbc;
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      overflow-x: auto;
    }
    .selector-strip label {
      font-size: 12px;
      font-weight: 800;
      color: #3b2219;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .table-dropdown {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #dfcfbc;
      background: #fbf8f3;
      font-size: 13px;
      font-weight: 700;
      color: #3b2219;
      cursor: pointer;
      outline: none;
    }
    .main-viewport {
      width: 100%;
      padding: 20px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .table-header-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .table-title {
      font-size: 23px;
      font-weight: 800;
      color: #2b1810;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-box {
      background: #ffffff;
      border: 1px solid #dfcfbc;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      width: 180px;
      color: #2b1810;
      outline: none;
    }
    .date-pill-btn {
      background: #ffffff;
      border: 1px solid #dfcfbc;
      color: #3b2219;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .date-pill-btn.active, .date-pill-btn:hover {
      background: #3b2219;
      color: #ffffff;
      border-color: #3b2219;
    }
    .date-input {
      background: #ffffff;
      border: 1px solid #dfcfbc;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #2b1810;
    }
    .table-card-wrapper {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dfcfbc;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(59, 34, 25, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .table-scroll-surface {
      width: 100%;
      overflow-x: auto;
    }
    table.master-table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      text-align: left;
    }
    table.master-table thead tr {
      background-color: #3b2219;
      color: #ffffff;
    }
    table.master-table th {
      padding: 14px 16px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border-right: 1px solid #4a2d22;
      white-space: nowrap;
    }
    table.master-table th:last-child {
      border-right: none;
    }
    table.master-table tbody tr {
      border-bottom: 1px solid #e8decb;
    }
    table.master-table tbody tr:nth-child(odd) {
      background-color: #fdfbf7;
    }
    table.master-table tbody tr:nth-child(even) {
      background-color: #f4ecdf;
    }
    table.master-table td {
      padding: 12px 16px;
      font-size: 13px;
      color: #331f16;
      border-right: 1px solid #e8decb;
      vertical-align: middle;
      white-space: nowrap;
    }
    table.master-table td:last-child {
      border-right: none;
    }
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      color: #785a46;
      font-weight: 700;
      font-size: 14px;
      background: #fdfbf7;
    }
    .table-summary-bar {
      background: #ebdcc8;
      border-top: 1px solid #dfcfbc;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: #3b2219;
    }
    .btn-action-pill {
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-green { background: #15803d; color: #ffffff; }
    .pill-red { background: #b91c1c; color: #ffffff; }
    .pill-blue { background: #0284c7; color: #ffffff; }
    .pill-dark { background: #3b2219; color: #ffffff; }

    /* Mandatory Feedback Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .modal-card {
      background: #ffffff;
      border: 2px solid #3b2219;
      border-radius: 14px;
      padding: 20px 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .modal-card h4 {
      font-size: 15px;
      font-weight: 800;
      color: #3b2219;
      margin-bottom: 8px;
    }
    .modal-card p {
      font-size: 12px;
      color: #785a46;
      margin-bottom: 12px;
    }
    .modal-card textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #dfcfbc;
      font-size: 12.5px;
      color: #2b1810;
      outline: none;
      resize: none;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header class="top-navbar">
    <div class="top-left">
      <button type="button" class="back-btn-top" onclick="handleHardwareBack()">← Back To Desk</button>
      <div class="brand-title">SuperShopping Founder Desk</div>
      <div class="breadcrumb">&gt; <span id="viewBreadcrumb">Customer Tables</span></div>
    </div>
  </header>

  <nav class="selector-strip">
    <label for="tableSelector">Select Table View:</label>
    <select id="tableSelector" class="table-dropdown" onchange="switchTable(this.value)">
      <optgroup label="1. Customer Request Claim (Cashback)">
        <option value="cb-1">1. New Request Claim (1 to 25 Days)</option>
        <option value="cb-2">2. Under 26 to 50 Days</option>
        <option value="cb-3">3. Under 51 to 75 Days</option>
        <option value="cb-4">4. Under 76 to 100 Days</option>
        <option value="cb-5">5. 101 Send Cashback (100 Days Completed)</option>
        <option value="cb-hist-completed">6A. History - Completed Cashback</option>
        <option value="cb-hist-bin">6B. History - Recycling Bin</option>
      </optgroup>
      <optgroup label="2. Customer Request Claim (Green Coin)">
        <option value="gc-1">7. Request For Reward (AI / Manual Audit)</option>
        <option value="gc-2">8. Under 1 to 7 Days</option>
        <option value="gc-3">9. Under 8 to 12 Days</option>
        <option value="gc-4">10. Final Steps (12 Days Completed)</option>
        <option value="gc-hist-completed">11A. History - Completed Green Coins</option>
        <option value="gc-hist-bin-ai">11B. History - Recycling Bin (AI)</option>
        <option value="gc-hist-bin-manual">11C. History - Recycling Bin (Manual)</option>
      </optgroup>
      <optgroup label="3. E-Book Purchases (Cash)">
        <option value="eb-cash-trans">12. Customer Transfer Details</option>
        <option value="eb-cash-sales">13. Sales Details & Bank Verification</option>
        <option value="eb-cash-failed">14. Failed / Dropped Transactions</option>
        <option value="eb-cash-ledger">15. Financial Ledger Account</option>
      </optgroup>
      <optgroup label="4. E-Book Purchases (Green Coin & Bank)">
        <option value="eb-coin-trans">16. Sale By Green Coins</option>
        <option value="eb-coin-sales">17. Green Coin Sales Detail 2</option>
        <option value="eb-coin-failed">18. Wrong Transaction Desk</option>
        <option value="eb-coin-book">19. Green Coin Transaction Book</option>
        <option value="eb-bank-vault">20. Bank (Central Green Coin Vault)</option>
      </optgroup>
      <optgroup label="5. Register ID Matrix">
        <option value="reg-cust">21. Customer Register Detail</option>
        <option value="reg-ref">22. Customer Referral Match Ledger</option>
        <option value="reg-login-ref">23. Login By Referral Code</option>
        <option value="reg-blocked">24. Blocked Customer Database</option>
      </optgroup>
      <optgroup label="6. Traffic & Platform Analytics">
        <option value="vis-guest">25. Guest Mode Visitors</option>
        <option value="vis-member">26. Member Visitors</option>
        <option value="click-analytics">27. Store Click Redirection Analytics</option>
      </optgroup>
    </select>
  </nav>

  <main class="main-viewport">
    <div class="table-header-block">
      <h2 class="table-title" id="displayTableTitle">Table View</h2>
      <div class="filter-group">
        <input type="text" class="search-box" placeholder="Search records..." oninput="handleSearch(this.value)">
        <button type="button" class="date-pill-btn active" onclick="setFilter('today', this)">Today</button>
        <button type="button" class="date-pill-btn" onclick="setFilter('tomorrow', this)">Tomorrow</button>
        <button type="button" class="date-pill-btn" onclick="setFilter('weekly', this)">Weekly</button>
        <button type="button" class="date-pill-btn" onclick="setFilter('monthly', this)">Monthly</button>
        <button type="button" class="date-pill-btn" onclick="setFilter('yearly', this)">Yearly</button>
        <button type="button" class="date-pill-btn" onclick="setFilter('all', this)">All</button>
        <input type="date" class="date-input" id="customDateFilter" onchange="setFilter('custom', this)">
      </div>
    </div>

    <div class="table-card-wrapper">
      <div class="table-scroll-surface">
        <table class="master-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-summary-bar">
        <span id="summaryLeft">Total Items: 0</span>
        <span id="summaryRight">Total Amount: ₹0</span>
      </div>
    </div>
  </main>

  <!-- Mandatory Feedback Popup Modal (Photo 2, 4, 8) -->
  <div class="modal-overlay" id="feedbackModal">
    <div class="modal-card">
      <h4 id="modalHeading">Cancel Request & Feedback</h4>
      <p id="modalSub">Enter mandatory feedback reason:</p>
      <textarea id="feedbackText" placeholder="Write feedback reason here..."></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-action-pill pill-dark" onclick="closeFeedbackModal()">Close</button>
        <button type="button" class="btn-action-pill pill-red" id="btnModalConfirm">Submit Cancel</button>
      </div>
    </div>
  </div>

  <!-- ================= FIREBASE CLOUD DATA CENTRE ================= -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 1. Firebase Cloud Setup (Screen Keys Embedded)
    const firebaseConfig = {
      apiKey: "AIzaSyBwn4pJz2Ay9dDGJoSxwn___lQJu86qjsM",
      authDomain: "supershopping-core.firebaseapp.com",
      projectId: "supershopping-core",
      storageBucket: "supershopping-core.firebasestorage.app",
      messagingSenderId: "418018835419",
      appId: "1:418018835419:web:3844d9ee37ba79e13885fe",
      measurementId: "G-P1TB3QDE1N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Part B: Live Cloud Reader Function
    function listenLiveTableData(collectionName, callback) {
      db.collection(collectionName).onSnapshot((snapshot) => {
        const liveRecords = [];
        snapshot.forEach((doc) => {
          liveRecords.push({ id: doc.id, ...doc.data() });
        });
        callback(liveRecords);
      }, (error) => {
        console.error("Cloud DB Error:", error);
      });
    }
  </script>

        title: "3. Customer Login By Referral Code",
        headers: ["SNo.", "Date / Day / Time", "Username ID", "Name", "Email ID", "Phone Number", "Address", "User Referral Code", "Referral Count", "Status (Active/Block)"],
        sumL: "Invited Users: ", sumR: "Verification: Active", key: "registeredUsers"
      },
      'reg-blocked': {
        title: "4. Blocked Customer Database",
        headers: ["SNo.", "Date / Day / Time", "Username ID", "Name", "Email ID", "Phone Number", "Address", "Mandatory Feedback Reason", "Status (Active/Block)"],
        sumL: "Blocked Accounts: ", sumR: "Security Status: Suspended", key: "blockedUsers"
      },

      // 6. TRAFFIC & ANALYTICS
      'vis-guest': {
        title: "Visitor Count: Guest Mode",
        headers: ["Time Period", "Unique IP Count", "Pageviews", "Bounce Rate", "Platform Hits", "Status"],
        sumL: "Traffic Segments: ", sumR: "Total Hits: 0", key: "guestTraffic"
      },
      'vis-member': {
        title: "Visitor Count: Login Member Visitors",
        headers: ["Time Period", "Active Members", "Session Duration", "Actions Logged", "Wallet Views", "Status"],
        sumL: "Active Sessions: ", sumR: "Retention: Normal", key: "loginTraffic"
      },
      'click-analytics': {
        title: "Store Redirection Click Analytics",
        headers: ["Store Platform", "Today Clicks", "Tomorrow", "Weekly", "Monthly", "Yearly", "All Time Total"],
        sumL: "Tracked Platforms: ", sumR: "Total Platform Clicks: 0", key: "linkClicks"
      }
    };

    let currentTableKey = 'cb-1';

    function getDB() {
      try {
        const raw = localStorage.getItem('ss_owner_cust_master_db');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function switchTable(key) {
      currentTableKey = key;
      renderCurrentTable();
    }

    function renderCurrentTable() {
      const schema = TABLE_SCHEMAS[currentTableKey];
      if (!schema) return;

      document.getElementById('displayTableTitle').textContent = schema.title;
      document.getElementById('viewBreadcrumb').textContent = schema.title;

      const tHead = document.getElementById('tableHead');
      tHead.innerHTML = '<tr>' + schema.headers.map(h => `<th>${h}</th>`).join('') + '</tr>';

      const tBody = document.getElementById('tableBody');
      const db = getDB();
      const records = db[schema.key] || [];

      let list = Array.isArray(records) ? records : [];
      if (schema.step) {
        list = list.filter(item => item.currentStep === schema.step);
      }

      if (list.length === 0) {
        tBody.innerHTML = `<tr><td colspan="${schema.headers.length}" class="empty-state">No customer records under this stage right now. Live operational entries will appear here.</td></tr>`;
        document.getElementById('summaryLeft').textContent = schema.sumL + "0";
        document.getElementById('summaryRight').textContent = schema.sumR + "0";
        return;
      }

      tBody.innerHTML = list.map((row) => {
        return '<tr>' + schema.headers.map(h => `<td>${row[h] || 'N/A'}</td>`).join('') + '</tr>';
      }).join('');

      document.getElementById('summaryLeft').textContent = schema.sumL + list.length;
      document.getElementById('summaryRight').textContent = schema.sumR + "0";
    }

    function setFilter(period, btn) {
      document.querySelectorAll('.date-pill-btn').forEach(b => b.classList.remove('active'));
      if (btn && btn.classList) btn.classList.add('active');
      renderCurrentTable();
    }

    function handleSearch(val) {
      renderCurrentTable();
    }

    function handleHardwareBack() {
      window.location.href = './ss-founder-desk.html';
    }

    window.onkeydown = function(e) {
      if ((e.altKey && e.key === 'ArrowLeft') || (e.key === 'Backspace' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
        e.preventDefault();
        handleHardwareBack();
      }
    };

    function triggerModal(title, callback) {
      document.getElementById('modalHeading').textContent = title;
      document.getElementById('feedbackText').value = '';
      document.getElementById('feedbackModal').style.display = 'flex';
      document.getElementById('btnModalConfirm').onclick = function() {
        const reason = document.getElementById('feedbackText').value.trim();
        if (!reason) {
          alert('Mandatory: Feedback reason is required.');
          return;
        }
        callback(reason);
        closeFeedbackModal();
      };
    }

    function closeFeedbackModal() {
      document.getElementById('feedbackModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const target = urlParams.get('table');
      if (target && TABLE_SCHEMAS[target]) {
        currentTableKey = target;
        document.getElementById('tableSelector').value = target;
      } else {
        currentTableKey = 'cb-1';
        document.getElementById('tableSelector').value = 'cb-1';
      }
      renderCurrentTable();
    });
  </script>
</body>
</html>
